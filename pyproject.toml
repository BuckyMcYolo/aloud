[project]
name = "aloud"
version = "0.1.0"
description = "Read any selected text aloud on macOS with a local Kokoro voice"
requires-python = ">=3.10"
dependencies = [
    "kokoro-onnx>=0.4.0",
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "rumps>=0.4.0",
    "pynput>=1.7.6",
    "pyobjc-framework-Cocoa>=10.0",
    "pyobjc-framework-Quartz>=10.0",
]

[project.scripts]
aloud = "aloud.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aloud"]
